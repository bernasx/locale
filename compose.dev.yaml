# Local development: docker compose -f compose.dev.yaml up --build
services:
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${LOCAL_PORT:-5173}:5173"
    environment:
      # File watching across Docker Desktop bind mounts needs polling.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true

volumes:
  node_modules:
