<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f4" />
    <script>
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('locale-theme') || 'system'; } catch {}
        const theme = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1c201d' : '#f8f7f4';
      })();
    </script>
    <title>Locale — i18next JSON editor</title>
    <meta name="description" content="Import i18next JSON files, edit translation strings side by side, and export JSON or ZIP files. Projects stay in this browser. No automatic translation or cross-device sync." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Locale — i18next JSON editor" />
    <meta property="og:description" content="Import i18next JSON files, edit translation strings side by side, and export JSON or ZIP files. Projects stay in this browser." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
